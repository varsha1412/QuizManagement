<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>Quiz Result</h1>

    <h2>Your Score</h2>

    <h1>{{ score }} / {{ total }}</h1>

    {% if score == total %}
        <p>🎉 Excellent! All answers are correct.</p>
    {% elif score > 0 %}
        <p>👍 Good! Keep practicing.</p>
    {% else %}
        <p>📚 Keep learning and try again.</p>
    {% endif %}

    <br>

    <a href="/quiz">
        <button>Take Quiz Again</button>
    </a>

    <br><br>

    <a href="/dashboard">
        <button>Back to Dashboard</button>
    </a>
</div>

</body>
</html>
